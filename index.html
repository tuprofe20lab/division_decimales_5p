<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TuProfe20 Lab · División de números decimales</title>

    <!-- Tailwind CSS, React 18, ReactDOM y Babel -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- KaTeX para fórmulas matemáticas nítidas -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap');

        html, body { margin: 0; padding: 0; background: #0a0322; }
        body { font-family: 'Nunito', sans-serif; overflow-x: hidden; -webkit-tap-highlight-color: transparent; }
        button { user-select: none; }

        /* Fondo neón principal */
        .app-bg {
            background:
                radial-gradient(circle at 12% 18%, rgba(255, 0, 170, 0.35), transparent 38%),
                radial-gradient(circle at 88% 12%, rgba(0, 229, 255, 0.30), transparent 40%),
                radial-gradient(circle at 70% 92%, rgba(198, 255, 0, 0.16), transparent 42%),
                linear-gradient(135deg, #0a0322 0%, #1b0a52 45%, #33084f 100%);
        }
        .stage-bg {
            background:
                radial-gradient(circle at 50% 45%, rgba(124, 58, 237, 0.45), transparent 60%),
                linear-gradient(180deg, #120838 0%, #070219 100%);
        }
        .blob { position: absolute; width: 42vmax; height: 42vmax; border-radius: 9999px; filter: blur(90px); opacity: 0.22; animation: blobMove 20s ease-in-out infinite; }
        @keyframes blobMove { 0%,100% { transform: translate(0,0) scale(1); } 33% { transform: translate(6vw,-4vh) scale(1.1); } 66% { transform: translate(-5vw,5vh) scale(0.92); } }

        .neon-text { background: linear-gradient(90deg, #00f0ff, #ff3df2, #ffe600); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .neon-text-big { background: linear-gradient(90deg, #00f0ff 0%, #ff3df2 40%, #ff9a00 70%, #c6ff00 100%); background-size: 200% auto; -webkit-background-clip: text; background-clip: text; color: transparent; animation: shine 6s linear infinite; filter: drop-shadow(0 0 18px rgba(255, 61, 242, 0.45)); }
        @keyframes shine { to { background-position: 200% center; } }

        @keyframes floatUp { 0% { transform: translateY(105vh) rotate(0deg); } 100% { transform: translateY(-110vh) rotate(360deg); } }
        @keyframes slideInRight { 0% { opacity: 0; transform: translateX(14px); } 100% { opacity: 1; transform: translateX(0); } }
        @keyframes robotFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
        @keyframes robotThinkTilt { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(6deg) translateY(-3px); } }
        @keyframes robotJump { 0%, 100% { transform: translateY(0); } 30% { transform: translateY(-14px); } }
        @keyframes robotTalkArmL { 0%, 100% { transform: rotate(45deg); } 50% { transform: rotate(95deg); } }
        @keyframes robotTalkArmR { 0%, 100% { transform: rotate(-45deg); } 50% { transform: rotate(-95deg); } }
        @keyframes confettiExplosion { 0% { transform: translate(0,0) scale(1) rotate(0deg); opacity: 1; } 80% { opacity: 1; } 100% { transform: translate(var(--tx), var(--ty)) scale(0) rotate(var(--rot)); opacity: 0; } }
        @keyframes finalGlowNeon { 0%, 100% { box-shadow: 0 0 10px rgba(16,185,129,0.45); } 50% { box-shadow: 0 0 28px rgba(198,255,0,0.9); } }

        .animate-floatUp { animation: floatUp linear infinite; }
        .animate-slideInRight { animation: slideInRight 0.3s ease-out forwards; }
        .animate-robotFloat { animation: robotFloat 3s ease-in-out infinite; }
        .animate-robotThinkTilt { animation: robotThinkTilt 2s ease-in-out infinite; }
        .animate-robotJump { animation: robotJump 1s cubic-bezier(0.28, 0.84, 0.42, 1) infinite; }
        .animate-robotTalkArmL { animation: robotTalkArmL 0.6s ease-in-out infinite; }
        .animate-robotTalkArmR { animation: robotTalkArmR 0.6s ease-in-out infinite 0.1s; }
        .animate-confettiExplosion { animation: confettiExplosion 1.8s cubic-bezier(0.25, 1, 0.5, 1) forwards; }
        .animate-finalGlowNeon { animation: finalGlowNeon 1.6s ease-in-out infinite; }

        .scrollbar-hide::-webkit-scrollbar { display: none !important; }
        .scrollbar-hide { -ms-overflow-style: none !important; scrollbar-width: none !important; }

        /* Deslizadores neón */
        input[type=range].neon-range { -webkit-appearance: none; appearance: none; height: 12px; border-radius: 9999px; outline: none; cursor: pointer; }
        input[type=range].neon-range::-webkit-slider-thumb { -webkit-appearance: none; width: 28px; height: 28px; border-radius: 9999px; background: #fff; border: 4px solid #ff3df2; box-shadow: 0 0 14px #ff3df2, 0 0 4px #fff; }
        input[type=range].neon-range::-moz-range-thumb { width: 22px; height: 22px; border-radius: 9999px; background: #fff; border: 4px solid #ff3df2; box-shadow: 0 0 14px #ff3df2; }


        /* Escala general: se agranda en pantallas digitales (1920 px) y se mantiene legible en celular */
        html { font-size: clamp(14px, calc(5px + 0.83vw), 22px); }

        /* ---------- Galera (división formato peruano) ---------- */
        .galera { display: inline-grid; font-weight: 900; line-height: 1; font-variant-numeric: tabular-nums; }
        .gl-cell { position: relative; height: 1.28em; display: flex; align-items: center; justify-content: center; border-radius: 0.18em; transition: background 0.25s, color 0.25s, box-shadow 0.25s; }
        .gl-div { color: #0f172a; }
        .gl-prod { color: #2563eb; }
        .gl-rem { color: #0f172a; }
        .gl-minus { color: #2563eb; justify-content: flex-end; padding-right: 0.05em; }
        .gl-added { color: #ff1fd1 !important; text-shadow: 0 0 10px rgba(255,31,209,0.45); animation: popIn 0.45s cubic-bezier(.34,1.8,.5,1); }
        .gl-hl { background: #fff36b; box-shadow: 0 0 0 0.06em #facc15, 0 0 18px rgba(250,204,21,0.8); }
        .gl-new { animation: rowIn 0.45s ease-out; }
        .gl-line { align-self: end; height: 0.08em; background: #0f172a; border-radius: 9999px; margin-bottom: 0.02em; }
        .gl-comma { position: absolute; right: -0.2em; bottom: 0.02em; color: #ff1fd1; font-size: 0.95em; }
        .gl-q { color: #7c3aed; letter-spacing: 0.04em; }
        .gl-pending { color: #ff1fd1; animation: pulseQ 1s ease-in-out infinite; }
        @keyframes popIn { 0% { transform: scale(0); } 100% { transform: scale(1); } }
        @keyframes rowIn { 0% { opacity: 0; transform: translateY(-0.4em); } 100% { opacity: 1; transform: translateY(0); } }
        @keyframes pulseQ { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.45; transform: scale(1.15); } }

        /* Coma que salta */
        .coma-mov { position: absolute; bottom: 0.05em; color: #ff1fd1; text-shadow: 0 0 12px rgba(255,31,209,0.7); transition: left 0.9s cubic-bezier(.34,1.5,.5,1), opacity 0.6s; }
        .coma-hop { animation: hop 0.9s ease-in-out; }
        @keyframes hop { 0% { transform: translateY(0); } 45% { transform: translateY(-0.75em) scale(1.35); } 100% { transform: translateY(0); } }
        .digit-cell { display: inline-block; text-align: center; overflow: hidden; transition: width 0.7s cubic-bezier(.34,1.5,.5,1), opacity 0.6s, transform 0.6s; }

        @keyframes shake { 0%,100% { transform: translateX(0); } 20%,60% { transform: translateX(-10px); } 40%,80% { transform: translateX(10px); } }
        .animate-shake { animation: shake 0.45s ease-in-out; }
        @keyframes timerPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.12); } }
        .animate-timer { animation: timerPulse 0.5s ease-in-out infinite; }
        .key-btn { touch-action: manipulation; }

        /* KaTeX */
        .katex { font-weight: 800 !important; }
        .katex-display { margin: 0 !important; padding: 0 !important; }
        .math-flow-line { width: 100%; display: flex; align-items: center; overflow-x: auto; padding: 0.15rem 0; }
        .math-card .katex { font-size: clamp(0.9rem, 1.2vw, 1.12rem) !important; color: #0f172a !important; }
        .math-current .katex { font-size: clamp(1rem, 1.45vw, 1.35rem) !important; color: #0f172a !important; }
        .math-final .katex { font-size: clamp(1.05rem, 1.55vw, 1.45rem) !important; color: #065f46 !important; }
        .math-history .katex { font-size: clamp(0.88rem, 1.15vw, 1.1rem) !important; color: #475569 !important; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, memo, useCallback, useMemo } = React;


        // =========================================================================
        // 1. ICONOS SVG INLINE
        // =========================================================================
        const Icon = ({ paths, className = "", size = 24, fill = "none", strokeWidth = "2.5" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill={fill} stroke="currentColor" strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" className={className} dangerouslySetInnerHTML={{ __html: paths }} />
        );

        const VolumeX = (p) => <Icon {...p} paths='<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/>' />;
        const Volume2 = (p) => <Icon {...p} paths='<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>' />;
        const Rocket = (p) => <Icon {...p} paths='<path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/><path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/>' />;
        const Sparkles = (p) => <Icon {...p} paths='<path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/><path d="M5 3v4"/><path d="M3 5h4"/><path d="M19 3v4"/><path d="M17 5h4"/>' />;
        const Home = (p) => <Icon {...p} paths='<path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>' />;
        const ChevronLeft = (p) => <Icon {...p} paths='<polyline points="15 18 9 12 15 6"/>' />;
        const ChevronRight = (p) => <Icon {...p} paths='<polyline points="9 18 15 12 9 6"/>' />;
        const BoxIcon = (p) => <Icon {...p} paths='<path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/>' />;
        const HandPointer = (p) => <Icon {...p} paths='<path d="M18 11V6a2 2 0 0 0-2-2a2 2 0 0 0-2 2"/><path d="M14 10V4a2 2 0 0 0-2-2a2 2 0 0 0-2 2v2"/><path d="M10 10.5V6a2 2 0 0 0-2-2a2 2 0 0 0-2 2v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/>' />;

        // =========================================================================
        // 2. CONTROLADOR DE AUDIO (WEB AUDIO API)
        // =========================================================================
        const AudioController = {
            ctx: null, muted: false, bgmNode: null,
            init: function() {
                if (this.ctx) return;
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (AudioContext) this.ctx = new AudioContext();
            },
            startBGM: function() {
                if (!this.ctx) return;
                if (this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
                if (this.bgmNode) return;
                const mainGain = this.ctx.createGain();
                mainGain.gain.value = this.muted ? 0 : 0.045;
                const filter = this.ctx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.value = 760;
                filter.connect(mainGain);
                mainGain.connect(this.ctx.destination);
                this.bgmNode = { mainGain, filter, interval: null };
                const chords = [[55, 60, 64, 71], [52, 57, 64, 71], [53, 57, 60, 64], [50, 55, 59, 64]];
                let chordIndex = 0;
                const playChord = () => {
                    if (this.ctx.state !== 'running') return;
                    const chord = chords[chordIndex];
                    chordIndex = (chordIndex + 1) % chords.length;
                    chord.forEach((midi, i) => {
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        osc.type = 'sine';
                        osc.frequency.value = 440 * Math.pow(2, (midi - 69) / 12);
                        const now = this.ctx.currentTime;
                        const delay = i * 0.2;
                        gain.gain.setValueAtTime(0, now + delay);
                        gain.gain.linearRampToValueAtTime(0.14, now + delay + 2);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + delay + 7.5);
                        osc.connect(gain);
                        gain.connect(filter);
                        osc.start(now + delay);
                        osc.stop(now + delay + 7.5);
                    });
                };
                playChord();
                this.bgmNode.interval = setInterval(playChord, 6000);
            },
            play: function(type) {
                if (this.muted || !this.ctx) return;
                if (this.ctx.state === 'suspended') this.ctx.resume();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                const now = this.ctx.currentTime;
                if (type === 'pop') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(520, now);
                    osc.frequency.exponentialRampToValueAtTime(840, now + 0.1);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                    osc.start(now);
                    osc.stop(now + 0.1);
                } else if (type === 'hover') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(660, now);
                    osc.frequency.exponentialRampToValueAtTime(780, now + 0.05);
                    gain.gain.setValueAtTime(0.06, now);
                    gain.gain.exponentialRampToValueAtTime(0.005, now + 0.05);
                    osc.start(now);
                    osc.stop(now + 0.05);
                } else if (type === 'pop-reverse') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(640, now);
                    osc.frequency.exponentialRampToValueAtTime(280, now + 0.12);
                    gain.gain.setValueAtTime(0.16, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
                    osc.start(now);
                    osc.stop(now + 0.12);
                } else if (type === 'success') {
                    osc.disconnect();
                    const notes = [523.25, 659.25, 783.99, 1046.50];
                    notes.forEach((freq, i) => {
                        const o = this.ctx.createOscillator();
                        const g = this.ctx.createGain();
                        o.type = 'triangle';
                        o.frequency.value = freq;
                        o.connect(g);
                        g.connect(this.ctx.destination);
                        const startTime = now + (i * 0.07);
                        g.gain.setValueAtTime(0, startTime);
                        g.gain.linearRampToValueAtTime(0.18, startTime + 0.04);
                        g.gain.linearRampToValueAtTime(0, startTime + 0.35);
                        o.start(startTime);
                        o.stop(startTime + 0.35);
                    });
                } else if (type === 'swoosh') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(280, now);
                    osc.frequency.exponentialRampToValueAtTime(75, now + 0.18);
                    gain.gain.setValueAtTime(0.16, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.18);
                    osc.start(now);
                    osc.stop(now + 0.18);
                }
            },
            toggleMute: function() {
                this.muted = !this.muted;
                if (this.bgmNode && this.ctx) {
                    this.bgmNode.mainGain.gain.setTargetAtTime(this.muted ? 0 : 0.045, this.ctx.currentTime, 0.1);
                }
                return this.muted;
            }
        };

        // =========================================================================
        // 3. COMPONENTE KATEX
        // =========================================================================
        const MathDisplay = memo(({ latex, className = "", inline = false, align = "left" }) => {
            const containerRef = useRef(null);
            useEffect(() => {
                if (containerRef.current && window.katex) {
                    try {
                        window.katex.render(latex, containerRef.current, {
                            displayMode: !inline,
                            throwOnError: false,
                            strict: false,
                            trust: true
                        });
                    } catch (e) {
                        containerRef.current.innerText = latex;
                    }
                }
            }, [latex, inline]);

            if (inline) return <span ref={containerRef} className={`inline-block align-middle ${className}`} />;
            return (
                <div className={`math-flow-line scrollbar-hide ${align === 'center' ? 'justify-center' : 'justify-start'} ${className}`}>
                    <div ref={containerRef} className={align === 'center' ? 'text-center' : 'text-left'} />
                </div>
            );
        });

        // =========================================================================
        // 4. PIZARRA INTERACTIVA COMPLETA
        // =========================================================================
        const DrawingCanvas = () => {
            const canvasRef = useRef(null);
            const [isDrawing, setIsDrawing] = useState(false);
            const [isDrawMode, setIsDrawMode] = useState(false);
            const [tool, setTool] = useState('pen');
            const [isSnapMode, setIsSnapMode] = useState(false);
            const [penColor, setPenColor] = useState('#ef4444');
            const [penWidth, setPenWidth] = useState(6);
            const penPointsRef = useRef([]);
            const activePointerRef = useRef(null);
            const savedImageRef = useRef(null);
            const startPosRef = useRef({ x: 0, y: 0 });
            const historyRef = useRef([]);

            const playPop = () => { AudioController.init(); AudioController.startBGM(); AudioController.play('pop'); };

            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas || !canvas.parentElement) return;
                let rafId = null;
                const updateSize = (entries) => {
                    const entry = entries[entries.length - 1];
                    if (!entry) return;
                    const width = Math.floor(entry.contentRect.width);
                    const height = Math.floor(entry.contentRect.height);
                    if (width <= 0 || height <= 0) return;
                    if (rafId) cancelAnimationFrame(rafId);
                    rafId = requestAnimationFrame(() => {
                        if (!canvas || (canvas.width === width && canvas.height === height)) return;
                        const ctx = canvas.getContext('2d');
                        let imgData = null;
                        if (canvas.width > 0 && canvas.height > 0) {
                            try { imgData = ctx.getImageData(0, 0, canvas.width, canvas.height); } catch (e) {}
                        }
                        canvas.width = width;
                        canvas.height = height;
                        if (imgData) ctx.putImageData(imgData, 0, 0);
                    });
                };
                const observer = new ResizeObserver(updateSize);
                observer.observe(canvas.parentElement);
                return () => {
                    if (rafId) cancelAnimationFrame(rafId);
                    observer.disconnect();
                };
            }, []);

            const renderPen = (points, straight = false) => {
                const ctx = canvasRef.current.getContext('2d');
                ctx.putImageData(savedImageRef.current, 0, 0);
                const angle = -15 * Math.PI / 180;
                const c = Math.cos(angle), s = Math.sin(angle);
                const local = points.map(p => ({ x: c * p.x + s * p.y, y: (-s * p.x + c * p.y) / 0.5 }));
                ctx.save();
                ctx.transform(c, s, -0.5 * s, 0.5 * c, 0, 0);
                ctx.lineWidth = penWidth;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.strokeStyle = penColor;
                ctx.fillStyle = penColor;
                ctx.globalCompositeOperation = 'source-over';
                ctx.beginPath();
                ctx.moveTo(local[0].x, local[0].y);
                if (local.length === 1) {
                    ctx.arc(local[0].x, local[0].y, penWidth / 2, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    if (!straight) {
                        for (let i = 1; i < local.length - 1; i++) {
                            const midpoint = {
                                x: (local[i].x + local[i + 1].x) / 2,
                                y: (local[i].y + local[i + 1].y) / 2
                            };
                            ctx.quadraticCurveTo(local[i].x, local[i].y, midpoint.x, midpoint.y);
                        }
                    }
                    const last = local[local.length - 1];
                    ctx.lineTo(last.x, last.y);
                    ctx.stroke();
                }
                ctx.restore();
            };

            const startDrawing = (e) => {
                if (!isDrawMode || activePointerRef.current !== null || (e.pointerType === 'mouse' && e.button !== 0)) return;
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                const rect = canvas.getBoundingClientRect();

                historyRef.current.push(ctx.getImageData(0, 0, canvas.width, canvas.height));

                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.lineWidth = tool === 'highlighter' ? 24 : penWidth;
                ctx.strokeStyle = tool === 'highlighter' ? `${penColor}4D` : penColor;
                ctx.globalCompositeOperation = tool === 'highlighter' ? 'multiply' : 'source-over';

                const startX = e.clientX - rect.left;
                const startY = e.clientY - rect.top;

                savedImageRef.current = ctx.getImageData(0, 0, canvas.width, canvas.height);
                startPosRef.current = { x: startX, y: startY };

                ctx.beginPath();
                ctx.moveTo(startX, startY);
                penPointsRef.current = [{ x: startX, y: startY }];
                activePointerRef.current = e.pointerId;
                canvas.setPointerCapture(e.pointerId);
                if (tool === 'pen') renderPen(penPointsRef.current);
                setIsDrawing(true);
            };

            const draw = (e) => {
                if (activePointerRef.current !== e.pointerId || !isDrawMode) return;
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                const rect = canvas.getBoundingClientRect();
                const currentX = e.clientX - rect.left;
                const currentY = e.clientY - rect.top;

                if (isSnapMode || e.shiftKey) {
                    ctx.putImageData(savedImageRef.current, 0, 0);
                    const dx = currentX - startPosRef.current.x;
                    const dy = currentY - startPosRef.current.y;
                    const angle = Math.atan2(dy, dx);
                    const snappedAngle = Math.round(angle / (Math.PI / 4)) * (Math.PI / 4);
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    const snapX = startPosRef.current.x + Math.cos(snappedAngle) * dist;
                    const snapY = startPosRef.current.y + Math.sin(snappedAngle) * dist;
                    if (tool === 'pen') {
                        renderPen([startPosRef.current, { x: snapX, y: snapY }], true);
                        return;
                    }
                    ctx.beginPath();
                    ctx.moveTo(startPosRef.current.x, startPosRef.current.y);
                    ctx.lineTo(snapX, snapY);
                    ctx.stroke();
                } else {
                    if (tool === 'pen') {
                        const events = e.nativeEvent?.getCoalescedEvents?.() || [];
                        const samples = events.length ? events : [e];
                        samples.forEach(sample => penPointsRef.current.push({
                            x: sample.clientX - rect.left,
                            y: sample.clientY - rect.top
                        }));
                        renderPen(penPointsRef.current);
                        return;
                    }
                    if (tool === 'highlighter') ctx.putImageData(savedImageRef.current, 0, 0);
                    ctx.lineTo(currentX, currentY);
                    ctx.stroke();
                }
            };

            const stopDrawing = () => {
                const canvas = canvasRef.current;
                const pointer = activePointerRef.current;
                activePointerRef.current = null;
                if (pointer !== null && canvas && canvas.hasPointerCapture(pointer)) {
                    canvas.releasePointerCapture(pointer);
                }
                if (isDrawing && canvas) {
                    canvas.getContext('2d').closePath();
                    setIsDrawing(false);
                }
            };

            const selectTool = (nextTool) => {
                stopDrawing();
                playPop();
                const enabled = nextTool !== 'selector' && !(isDrawMode && tool === nextTool);
                setIsDrawMode(enabled);
                if (nextTool !== 'selector') setTool(nextTool);
            };

            useEffect(() => {
                const onKey = (event) => {
                    if (event.key === 'Escape') {
                        setIsDrawing(false);
                        setIsDrawMode(false);
                    }
                    if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'z') {
                        if (historyRef.current.length > 0 && canvasRef.current) {
                            playPop();
                            const lastState = historyRef.current.pop();
                            canvasRef.current.getContext('2d').putImageData(lastState, 0, 0);
                            savedImageRef.current = lastState;
                        }
                    }
                };
                window.addEventListener('keydown', onKey);
                return () => window.removeEventListener('keydown', onKey);
            }, []);

            const clearCanvas = () => {
                playPop();
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                historyRef.current.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                savedImageRef.current = ctx.getImageData(0, 0, canvas.width, canvas.height);
            };

            const colors = [
                { name: 'Rojo', hex: '#ef4444', tw: 'bg-[#ef4444]' },
                { name: 'Negro', hex: '#0f172a', tw: 'bg-[#0f172a]' },
                { name: 'Azul', hex: '#3b82f6', tw: 'bg-[#3b82f6]' },
                { name: 'Verde', hex: '#22c55e', tw: 'bg-[#22c55e]' },
                { name: 'Amarillo', hex: '#facc15', tw: 'bg-[#facc15]' }
            ];

            return (
                <>
                    <div style={{ zIndex: 120, pointerEvents: 'auto' }} className="absolute top-2 right-2 flex flex-wrap max-w-[calc(100%-1rem)] justify-end gap-1.5 bg-white/85 p-1.5 rounded-xl backdrop-blur-sm shadow-md border border-slate-200">
                        <button onClick={() => selectTool('selector')} aria-pressed={!isDrawMode} title="Usar la simulación (Esc)" className={`px-2.5 py-1 text-xs font-black rounded-lg border-2 shadow-sm transition-all ${!isDrawMode ? 'bg-cyan-500 text-white border-cyan-600' : 'bg-white text-slate-600 border-slate-300'}`}>🖱️ Usar</button>
                        <button onClick={() => selectTool('pen')} className={`px-2.5 py-1 text-xs font-black rounded-lg border-2 shadow-sm transition-all ${isDrawMode && tool === 'pen' ? 'bg-indigo-500 text-white border-indigo-600 scale-105' : 'bg-white text-slate-600 border-slate-300'}`}>🖊️ Lápiz</button>
                        <button onClick={() => selectTool('highlighter')} className={`px-2.5 py-1 text-xs font-black rounded-lg border-2 shadow-sm transition-all ${isDrawMode && tool === 'highlighter' ? 'bg-yellow-400 text-slate-900 border-yellow-500 scale-105' : 'bg-white text-slate-600 border-slate-300'}`}>🖍️ Resaltador</button>
                        {isDrawMode && tool === 'pen' && (
                            <label className="flex items-center gap-1.5 px-2 py-1 rounded-lg bg-white border-2 border-indigo-200 text-xs font-black text-slate-700">
                                Grosor <input type="range" min="3" max="16" step="1" value={penWidth} onChange={e => setPenWidth(Number(e.target.value))} className="w-16 accent-indigo-600" />
                            </label>
                        )}
                        {isDrawMode && (
                            <>
                                <button onClick={() => { playPop(); setIsSnapMode(!isSnapMode); }} className={`px-2.5 py-1 text-xs font-black rounded-lg border-2 shadow-sm transition-all ${isSnapMode ? 'bg-blue-500 text-white border-blue-600 scale-105' : 'bg-white text-slate-600 border-slate-300'}`}>📐 Recto</button>
                                <button onClick={clearCanvas} className="px-2.5 py-1 text-xs font-black bg-white text-rose-600 border-2 border-rose-300 rounded-lg shadow-sm hover:bg-rose-50 active:scale-95 transition-all">🗑️ Limpiar</button>
                                <div className="px-2 py-1 text-[11px] font-bold text-slate-400 hidden sm:flex items-center bg-white rounded-lg border border-slate-200">CTRL+Z</div>
                            </>
                        )}
                    </div>
                    {isDrawMode && (
                        <div className="absolute top-1/2 right-3 -translate-y-1/2 z-[110] flex flex-col gap-2.5 p-2 bg-white/90 backdrop-blur-md rounded-xl border-[3px] border-slate-200 shadow-xl pointer-events-auto">
                            {colors.map(c => (
                                <button key={c.hex} onClick={() => { playPop(); setPenColor(c.hex); }} title={c.name} className={`w-8 h-8 rounded-full border-[3px] shadow-sm transition-all hover:scale-110 active:scale-95 ${c.tw} ${penColor === c.hex ? 'border-white outline outline-[3px] outline-slate-800 scale-110' : 'border-black/20'}`} />
                            ))}
                        </div>
                    )}
                    <canvas
                        ref={canvasRef}
                        style={{ zIndex: 100, pointerEvents: isDrawMode ? 'auto' : 'none', touchAction: isDrawMode ? 'none' : 'auto' }}
                        className={`absolute inset-0 z-[100] touch-none ${isDrawMode ? 'cursor-crosshair pointer-events-auto' : 'pointer-events-none'}`}
                        onPointerDown={startDrawing}
                        onPointerMove={draw}
                        onPointerUp={e => { if (activePointerRef.current === e.pointerId) { draw(e); stopDrawing(); } }}
                        onPointerLeave={e => { if (!e.currentTarget.hasPointerCapture(e.pointerId)) stopDrawing(); }}
                        onLostPointerCapture={stopDrawing}
                        onPointerCancel={stopDrawing}
                    />
                </>
            );
        };

        // =========================================================================
        // 3b. ROBOT ASISTENTE (de la simulación original de Danny)
        // =========================================================================
        const RobotAssistant = ({ step, maxSteps, isHighlighting }) => {
            const isFinalStep = step >= maxSteps;
            const isThinking = step === maxSteps - 1 && maxSteps > 1;

            const getContainerAnim = () => {
                if (isFinalStep) return 'animate-robotJump';
                if (isThinking) return 'animate-robotThinkTilt';
                return 'animate-robotFloat';
            };
            const getArmLAnim = () => {
                if (isFinalStep) return 'rotate-[150deg] animate-pulse';
                if (step > 0 || isHighlighting) return 'animate-robotTalkArmL';

            };
            const getArmRAnim = () => {
                if (isFinalStep) return '-rotate-[150deg] animate-pulse';
                if (step > 0 || isHighlighting) return 'animate-robotTalkArmR';
                return '-rotate-45';
            };
            const getEyes = () => {
                if (isFinalStep) return <div className="w-full flex justify-between px-1"><div className="w-2.5 h-1.5 bg-emerald-400 rounded-t-full mt-0.5"></div><div className="w-2.5 h-1.5 bg-emerald-400 rounded-t-full mt-0.5"></div></div>;
                if (isHighlighting) return <div className="w-full flex justify-between px-1"><div className="w-2.5 h-2.5 bg-yellow-300 rounded-full animate-ping"></div><div className="w-2.5 h-2.5 bg-yellow-300 rounded-full animate-ping"></div></div>;
                if (step === 0) return <div className="w-full flex justify-between px-1.5"><div className="w-2 h-2 bg-cyan-400 rounded-full animate-pulse"></div><div className="w-2 h-2 bg-cyan-400 rounded-full animate-pulse"></div></div>;
                return <div className="w-full flex justify-between px-1"><div className="w-2.5 h-2.5 bg-yellow-400 rounded-full animate-bounce"></div><div className="w-2.5 h-2.5 bg-yellow-400 rounded-full animate-bounce"></div></div>;
            };
            const getMouth = () => {
                if (isFinalStep) return <div className="w-4 h-2.5 bg-rose-400 rounded-b-full mt-1"></div>;
                if (step === 0 && !isHighlighting) return <div className="w-3 h-1 bg-cyan-300 rounded-full mt-1"></div>;
                return <div className="w-2.5 h-2.5 bg-rose-400 rounded-full mt-1 animate-ping"></div>;
            };

            return (
                <div className={`relative flex flex-col items-center drop-shadow-xl select-none ${getContainerAnim()}`}>
                    <div className="relative z-0 flex flex-col items-center translate-y-1">
                        <div className={`w-2.5 h-2.5 rounded-full shadow-[0_0_10px_currentColor] z-10 transition-colors duration-300 ${isFinalStep ? 'text-emerald-400 bg-emerald-400' : 'text-yellow-400 bg-yellow-400 animate-pulse'}`}></div>
                        <div className="w-1.5 h-3 bg-slate-300"></div>
                    </div>
                    <div className="relative z-10 w-12 h-12 sm:w-14 sm:h-14 bg-gradient-to-br from-white to-slate-200 rounded-xl border-[2.5px] border-indigo-400 shadow-xl flex flex-col items-center justify-center p-1">
                        <div className="w-full h-full bg-slate-900 rounded-lg flex flex-col items-center justify-center p-1 shadow-inner border-[1.5px] border-indigo-500">
                            {getEyes()}
                            {getMouth()}
                        </div>
                    </div>
                    <div className={`absolute top-1/2 -left-1.5 w-2 h-4 bg-slate-200 border-[2px] border-indigo-400 rounded-full z-0 origin-top ${getArmLAnim()}`}></div>
                    <div className={`absolute top-1/2 -right-1.5 w-2 h-4 bg-slate-200 border-[2px] border-indigo-400 rounded-full z-0 origin-top ${getArmRAnim()}`}></div>
                </div>
            );
        };

        // @@MATH-START
        // =========================================================================
        // 4. MOTOR MATEMÁTICO PURO: DECIMALES, DIVISIÓN EN GALERA Y GENERADORES
        // =========================================================================
        // Un decimal se guarda como { n, d } = n / 10^d (enteros exactos, sin errores de coma flotante)
        function parseDec(str) {
            const s = String(str).replace(/\s/g, '').replace('.', ',');
            if (!/^\d*(,\d*)?$/.test(s) || s === '' || s === ',') return null;
            const [i, f = ''] = s.split(',');
            const n = Number((i || '0') + f);
            return { n, d: f.length };
        }
        function normDec(x) { let { n, d } = x; while (d > 0 && n % 10 === 0) { n /= 10; d--; } return { n, d }; }
        function pow10Big(k) { let r = BigInt(1); for (let i = 0; i < k; i++) r = r * BigInt(10); return r; }
        function decEq(x, y) { if (!x || !y) return false; return BigInt(x.n) * pow10Big(y.d) === BigInt(y.n) * pow10Big(x.d); }
        function mulDec(x, y) { return { n: x.n * y.n, d: x.d + y.d }; }
        // Texto con coma decimal y espacio de miles (estilo Perú): 1 710 ; 869,85
        function fmtDec(x, opts = {}) {
            const { strip = true, miles = true } = opts;
            const v = strip ? normDec(x) : x;
            let s = String(v.n).padStart(v.d + 1, '0');
            let ent = s.slice(0, s.length - v.d), fr = s.slice(s.length - v.d);
            if (miles) ent = ent.replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
            return fr ? `${ent},${fr}` : ent;
        }
        const fmtStr = (str, opts) => fmtDec(parseDec(str), opts);
        const texStr = (str, opts) => fmtStr(str, opts).replace(',', '{,}').replace(/ /g, '\\,');

        // ---------- División en galera (formato peruano) ----------
        function makeDivision(aStr, bStr, maxExtra = 4) {
            const A = parseDec(aStr), B = parseDec(bStr);
            const k = B.d; // lugares que corremos la coma
            let N = String(A.n).padStart(A.d + 1, '0'), dn;
            let zerosAdded = 0;
            if (A.d >= k) dn = A.d - k;
            else { zerosAdded = k - A.d; N = N + '0'.repeat(zerosAdded); dn = 0; }
            // quitamos ceros a la izquierda sobrantes (dejando al menos una cifra entera)
            while (N.length - dn > 1 && N[0] === '0') N = N.slice(1);
            const ip = N.length - dn;
            const d = B.n;
            const digits = N.split('').map(Number);
            const L = digits.length;
            let pos = 0, cur = 0;
            do { cur = cur * 10 + digits[pos]; pos++; } while (cur < d && pos < ip);
            const cycles = [];
            let startCol = 0, endCol = pos - 1, extra = 0, quotient = '';
            while (true) {
                const q = Math.floor(cur / d), prod = q * d, rem = cur - prod;
                quotient += String(q);
                const c = { cur, startCol, endCol, q, prod, rem, next: { type: 'end' } };
                cycles.push(c);
                if (pos < L) {
                    const comma = pos === ip;
                    c.next = { type: 'bring', digit: digits[pos], col: pos, added: false, comma };
                    if (comma) quotient += ',';
                    cur = rem * 10 + digits[pos]; pos++;
                } else if (rem !== 0 && extra < maxExtra) {
                    const comma = pos === ip;
                    c.next = { type: 'bring', digit: 0, col: pos, added: true, comma };
                    if (comma) quotient += ',';
                    cur = rem * 10; pos++; extra++;
                } else break;
                endCol = pos - 1; startCol = endCol - String(cur).length + 1;
            }
            const last = cycles[cycles.length - 1];
            return {
                a: aStr, b: bStr, A, B, k, N, ip, dn, d, zerosAdded, cycles, quotient,
                exact: last.rem === 0, remainder: last.rem, extraZeros: extra, cols: pos
            };
        }

        // Fotogramas de la galera (cada uno es una foto completa del pizarrón)
        function galeraFrames(div) {
            const { cycles, d } = div;
            const frames = [], rows = [];
            let quotient = '', partialRow = -1;
            const snap = (kind, msg, hl, ci) => frames.push({ kind, msg, quotient, ci, rows: rows.map(r => ({ ...r, added: r.added.slice() })), hl });
            const c0 = cycles[0];
            snap('start', c0.cur >= d
                ? `Tomamos la primera cifra (o cifras) del dividendo que formen un número igual o mayor que ${d}: el ${c0.cur}.`
                : `La parte entera (${c0.cur}) es menor que ${d}: el cociente empezará con 0.`, { row: -1, start: c0.startCol, end: c0.endCol }, 0);
            cycles.forEach((c, i) => {
                const hlP = partialRow === -1 ? { row: -1, start: c.startCol, end: c.endCol } : { row: partialRow };
                quotient += String(c.q);
                snap('q', c.q > 0
                    ? `¿Cuántas veces cabe ${d} en ${c.cur}? ${c.q} veces (${c.q} × ${d} = ${c.prod}). Escribimos ${c.q} en el cociente.`
                    : `${d} no cabe en ${c.cur}: escribimos 0 en el cociente.`, hlP, i);
                if (c.q > 0) {
                    const ps = String(c.prod);
                    rows.push({ start: c.endCol - ps.length + 1, text: ps, kind: 'prod', added: [] });
                    snap('mult', `Multiplicamos: ${c.q} × ${d} = ${c.prod}. Lo escribimos debajo del ${c.cur} para restar.`, { row: rows.length - 1 }, i);
                    const rs = String(c.rem);
                    rows.push({ start: c.endCol - rs.length + 1, text: rs, kind: 'rem', added: [] });
                    partialRow = rows.length - 1;
                    snap('sub', `Restamos: ${c.cur} − ${c.prod} = ${c.rem}.${c.rem === 0 && c.next.type === 'end' ? '' : ''}`, { row: partialRow }, i);
                } else if (partialRow === -1 && c.next.type === 'bring' && !c.next.added) {
                    // el número parcial sigue en el dividendo: solo "tomamos una cifra más"
                    if (c.next.comma) quotient += ',';
                    const nc = cycles[i + 1].cur;
                    snap('bring', c.next.comma
                        ? `Tomamos también el ${c.next.digit} (primera cifra después de la coma): ¡ponemos la coma en el cociente! Ahora tenemos ${nc}.`
                        : `Tomamos también el ${c.next.digit}. Ahora tenemos ${nc}.`, { row: -1, start: cycles[i + 1].startCol, end: cycles[i + 1].endCol }, i);
                    return;
                } else if (partialRow === -1) {
                    const rs = String(c.rem);
                    rows.push({ start: c.endCol - rs.length + 1, text: rs, kind: 'rem', added: [] });
                    partialRow = rows.length - 1;
                }
                if (c.next.type === 'bring') {
                    const row = rows[partialRow];
                    if (c.next.added) row.added.push(row.text.length);
                    row.text += String(c.next.digit);
                    if (c.next.comma) quotient += ',';
                    const nc = cycles[i + 1].cur;
                    let msg;
                    if (c.next.added) msg = `El resto (${c.rem}) no es cero y ya no quedan cifras: añadimos un 0 al resto${c.next.comma ? ' y ponemos la coma en el cociente' : ''}. Ahora tenemos ${nc}.`;
                    else if (c.next.comma) msg = `Bajamos el ${c.next.digit}, la primera cifra después de la coma: ¡ponemos la coma en el cociente! Ahora tenemos ${nc}.`;
                    else msg = `Bajamos el ${c.next.digit}. Ahora tenemos ${nc}.`;
                    snap('bring', msg, { row: partialRow }, i);
                }
            });
            const q = fmtDec(parseDec(div.quotient), { strip: false });
            snap('end', div.exact
                ? `El resto es 0: ¡división terminada! ${fmtStr(div.a, { strip: false })} ÷ ${fmtStr(div.b)} = ${q} 🎉`
                : `Paramos aquí: el cociente aproximado es ${q} y el resto es ${div.remainder}.`, null, cycles.length - 1);
            return frames;
        }

        // ---------- Generadores aleatorios por nivel (siempre exactos) ----------
        const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
        const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
        const decStr = (x) => fmtDec(x, { miles: false });
        function genDivision(level) {
            for (let t = 0; t < 500; t++) {
                let a, b, q, kind;
                if (level === 'facil') {
                    // decimal ÷ entero de una cifra; cociente con 1 o 2 decimales
                    const k = pick([1, 2]); const d = rnd(2, 9);
                    const qn = k === 1 ? rnd(11, 299) : rnd(101, 999);
                    if (qn % 10 === 0) continue;
                    q = { n: qn, d: k }; b = { n: d, d: 0 }; a = mulDec(q, b);
                    if (a.n % 10 === 0) continue; // que el dividendo tenga exactamente k decimales
                    kind = 'decimal ÷ entero';
                } else if (level === 'medio') {
                    const tipo = pick(['dec2', 'resto', 'entdec']);
                    if (tipo === 'dec2') {
                        const k = pick([1, 2]); const d = rnd(11, 25);
                        const qn = k === 1 ? rnd(11, 99) : rnd(101, 499);
                        if (qn % 10 === 0) continue;
                        q = { n: qn, d: k }; b = { n: d, d: 0 }; a = mulDec(q, b);
                        if (a.n % 10 === 0) continue;
                        kind = 'decimal ÷ entero';
                    } else if (tipo === 'resto') {
                        const d = pick([2, 4, 5, 8]); const N = rnd(5, 99);
                        if (N % d === 0) continue;
                        a = { n: N, d: 0 }; b = { n: d, d: 0 };
                        q = normDec({ n: N * 1000 / d, d: 3 });
                        kind = 'entero ÷ entero (resto ≠ 0)';
                    } else {
                        const bn = rnd(2, 95); if (bn % 10 === 0) continue;
                        b = { n: bn, d: 1 }; const qi = rnd(2, 60);
                        q = { n: qi, d: 0 }; a = normDec(mulDec(q, b));
                        if (a.d !== 0) continue; // dividendo entero
                        kind = 'entero ÷ decimal';
                    }
                } else {
                    // decimal ÷ decimal
                    const bd = pick([1, 1, 2]);
                    const bn = bd === 1 ? rnd(11, 95) : rnd(11, 99);
                    if (bn % 10 === 0) continue;
                    b = { n: bn, d: bd };
                    const qd = pick([0, 1, 1, 2]);
                    const qn = qd === 0 ? rnd(2, 40) : qd === 1 ? rnd(11, 99) : rnd(101, 299);
                    if (qd > 0 && qn % 10 === 0) continue;
                    q = { n: qn, d: qd }; a = normDec(mulDec(q, b));
                    if (a.d === 0) continue;
                    kind = 'decimal ÷ decimal';
                }
                const as = decStr(a), bs = decStr(b);
                const div = makeDivision(as, bs, 4);
                if (!div.exact || div.N.length > 6 || String(div.d).length > 3 || a.d > 3) continue;
                return { a: as, b: bs, q: decStr(normDec(q)), kind, level };
            }
            return { a: '72,96', b: '4', q: '18,24', kind: 'decimal ÷ entero', level };
        }

        // Opciones para la competencia: el cociente correcto y "errores típicos" con la coma
        function quotientOptions(qStr) {
            const q = normDec(parseDec(qStr));
            const cand = [q, { n: q.n, d: q.d + 1 }, { n: q.n * 10, d: q.d }, { n: q.n, d: q.d + 2 }, { n: q.n + 1, d: q.d }, { n: Math.max(1, q.n - 1), d: q.d }, { n: q.n * 100, d: q.d }];
            const seen = new Set(); const out = [];
            cand.forEach(c => { const s = decStr(normDec(c)); if (!seen.has(s) && out.length < 4) { seen.add(s); out.push(s); } });
            return out;
        }
        function genQuickQuestion() {
            const t = pick(['div', 'div', 'div', 'coma']);
            if (t === 'coma') {
                const g = genDivision(pick(['medio', 'dificil']));
                const B = parseDec(g.b);
                if (B.d === 0) return genQuickQuestion();
                return { type: 'coma', a: g.a, b: g.b, prompt: `Para dividir ${fmtStr(g.a)} ÷ ${fmtStr(g.b)}, ¿cuántos lugares corremos la coma (en el dividendo y en el divisor)?`, options: ['0', '1', '2', '3'], answer: String(B.d) };
            }
            const g = genDivision(pick(['facil', 'facil', 'medio', 'dificil']));
            return { type: 'div', a: g.a, b: g.b, prompt: `¿Cuánto es ${fmtStr(g.a)} ÷ ${fmtStr(g.b)}?`, options: quotientOptions(g.q), answer: g.q };
        }
        // "¿Dónde va la coma?": cifras del cociente sin coma y posición correcta
        function genComaGame() {
            for (let t = 0; t < 200; t++) {
                const g = genDivision(pick(['facil', 'medio', 'dificil']));
                const q = normDec(parseDec(g.q));
                if (q.n < 10) continue;
                const digits = String(q.n);
                const intLen = digits.length - q.d;
                if (intLen < 1) continue;
                return { ...g, digits, slot: intLen }; // slot = nº de cifras antes de la coma (= digits.length si no lleva coma)
            }
            return { a: '72,96', b: '4', q: '18,24', digits: '1824', slot: 2 };
        }

        // ---------- GALERA ----------
        const QuotientText = ({ q }) => <>{q.split('').map((ch, i) => ch === ',' ? <span key={i} className="text-[#ff1fd1]">,</span> : <span key={i}>{ch}</span>)}</>;

        const Galera = ({ div, frame, pendingQ = false, pendingRem = null, size = 2.6, className = '' }) => {

        // ---------- LA COMA QUE SALTA ----------
        const NumCells = ({ digits, commaBefore, commaAfter, phase, added = 0 }) => {
            const W = 0.8;

            const after = phase === 'after';
            const visLen = after ? all.length : digits.length;
            const commaPos = after ? commaAfter : commaBefore;
            let lead = 0;

            return (
                <span className="relative inline-flex align-bottom" style={{ height: '1.3em' }}>

                if (disabled) return;

                else if (value.length < maxLen) onChange(value + k);
            };
            const ref = useRef({}); ref.current = { press, onOk, disabled, value };
            useEffect(() => {
                const h = (e) => {
                    if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
                    if (/^[0-9]$/.test(e.key)) ref.current.press(e.key);
                    else if (e.key === ',' || e.key === '.') ref.current.press(',');
