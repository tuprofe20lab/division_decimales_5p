        // ---------- PIZARRA PASO A PASO (galera animada) ----------
        function buildSteps(div, pre = [], post = []) {
            const frames = galeraFrames(div);
            const steps = [];
            const A = fmtStr(div.a, { strip: false }), Bs = fmtStr(div.b);
            steps.push({ t: 'intro', badge: 'Observamos el divisor', msg: div.k === 0 ? `El divisor (${Bs}) es un número entero: ¡podemos dividir directamente en la galera!` : `El divisor (${Bs}) tiene ${div.k} cifra${div.k > 1 ? 's' : ''} decimal${div.k > 1 ? 'es' : ''}. Primero tenemos que convertirlo en entero.` });
            pre.forEach(p => steps.push({ t: 'pre', card: p, badge: p.badge, msg: p.msg }));
            if (div.k > 0) {
                steps.push({ t: 'shift0', badge: 'Corremos la coma', msg: `Corremos la coma ${div.k} lugar${div.k > 1 ? 'es' : ''} a la derecha en el divisor y LOS MISMOS ${div.k} en el dividendo. ¡Mira cómo salta!` });
                steps.push({ t: 'shift1', badge: 'Nueva división', msg: `${A} ÷ ${Bs} se convierte en ${fmtDec({ n: Number(div.N), d: div.dn }, { strip: false })} ÷ ${div.d}.${div.zerosAdded ? ` Como faltaban cifras, añadimos ${div.zerosAdded} cero${div.zerosAdded > 1 ? 's' : ''} al dividendo.` : ''} El resultado no cambia porque multiplicamos ambos por ${10 ** div.k}.` });
            }
            const g0 = steps.length;
            frames.forEach((f, i) => steps.push({ t: 'galera', fi: i, badge: 'Dividimos', msg: f.msg, final: f.kind === 'end' && post.length === 0 }));
            post.forEach((p, i) => steps.push({ t: 'post', card: p, badge: p.badge, msg: p.msg, final: i === post.length - 1 }));
            return { steps, frames, g0 };
        }

        function DivisionStepper({ a, b, header, pre = [], post = [], accent = '#ff3df2', onDone }) {
            const div = useMemo(() => makeDivision(a, b), [a, b]);
            const { steps, frames, g0 } = useMemo(() => buildSteps(div, pre, post), [div]);
            const size = galeraSize(frames);
            const [step, setStep] = useState(0);
            const [confetti, fire] = useConfetti();
            useEffect(() => { setStep(0); }, [a, b]);
            const maxS = steps.length - 1;
            const cur = steps[Math.min(step, maxS)];
            const next = () => {
                AudioController.init(); AudioController.startBGM();
                if (step < maxS) { const n = step + 1; setStep(n); if (n === maxS) { sfx('success'); fire(); } else sfx('pop'); }
                else { sfx('swoosh'); if (onDone) onDone(); else setStep(0); }
            };
            const prev = () => { if (step > 0) { setStep(step - 1); sfx('pop-reverse'); } };
            const shiftIdx = steps.findIndex(s => s.t === 'shift1');
            const phase = shiftIdx >= 0 && step >= shiftIdx ? 'after' : 'before';
            const fIdx = step >= g0 ? Math.min(steps[Math.min(step, g0 + frames.length - 1)].fi, frames.length - 1) : -1;
            const cards = steps.slice(0, step + 1).filter(s => s.t === 'pre' || s.t === 'post');
            return (
                <div className="relative flex flex-col rounded-[1.6rem] overflow-hidden bg-white border-[5px] border-white shadow-[0_0_0_3px_rgba(255,61,242,0.75),0_25px_55px_rgba(0,0,0,0.5)] lg:h-[calc(100dvh-12.5rem)] lg:min-h-[32rem]">
                    {confetti}
                    <DrawingCanvas />
                    <div className="shrink-0 bg-[#0a0322] px-4 pt-12 sm:pt-3 pb-3 border-b-4" style={{ borderColor: accent }}>
                        <div className="sm:pr-72">{header}</div>
                    </div>
                    <div className="flex-1 min-h-0 flex flex-col lg:flex-row">
                        <div className="relative flex-1 min-w-0 bg-slate-50 p-3 sm:p-4 flex flex-col items-center gap-3 overflow-auto scrollbar-hide">
                            <div className="absolute inset-0 opacity-[0.05] pointer-events-none bg-[radial-gradient(#0f172a_1.5px,transparent_1.5px)] [background-size:20px_20px]" />
                            <div className="relative w-full rounded-2xl bg-white border-2 border-slate-200 py-2.5 px-2 shadow-sm">
                                {div.k > 0 ? <ComaShift div={div} phase={phase} size={2.4} /> : (
                                    <div className="text-center font-black text-slate-900" style={{ fontSize: 'clamp(1.5rem, 2.4rem, 9vw)' }}>{fmtStr(a, { strip: false })} <span className="text-[#7c3aed]">÷</span> {fmtStr(b)}</div>
                                )}
                            </div>
                            <div className="relative w-full flex-1 flex justify-center items-start py-1">
                                {fIdx >= 0 ? <Galera div={div} frame={frames[fIdx]} size={size} /> : <div className="text-slate-400 font-black text-lg py-10 text-center">La galera aparecerá aquí 👇<br />Presiona «¡Siguiente paso!»</div>}
                            </div>
                        </div>
                        <div className="lg:w-[36%] shrink-0 flex flex-col gap-2.5 p-3 bg-gradient-to-b from-[#f5e1ff] to-[#d9c2ff] border-t-[3px] lg:border-t-0 lg:border-l-[3px] border-white">
                            <div className="lg:flex-1 lg:min-h-0 lg:overflow-y-auto scrollbar-hide flex flex-col gap-2">
                                <div className="text-xs sm:text-sm font-black text-[#7c3aed] uppercase tracking-wider">{cur.badge}</div>
                                {cards.map((s, i) => (
                                    <div key={s.badge + i} className={`rounded-2xl px-3 py-2 border-2 animate-slideInRight ${s.final && step === maxS ? 'bg-gradient-to-r from-[#d9ffe6] to-[#fff9c4] border-[#10b981] animate-finalGlowNeon math-final' : 'bg-white border-[#ff3df2] math-current'}`}>
                                        <div className="text-xs sm:text-sm font-black text-[#c026d3] mb-0.5">{s.badge}</div>
                                        <MathDisplay latex={s.card.latex} />
                                    </div>
                                ))}
                            </div>
                            <RobotSays text={cur.msg} step={step} maxSteps={maxS} highlight={step > 0} />
                            <div className="flex items-stretch gap-2 h-14 sm:h-16">
                                <button onClick={prev} disabled={step === 0} className="flex-[0.7] rounded-l-2xl bg-[#c4b5fd] text-[#3b0764] font-black text-base border-b-4 border-[#7c3aed] active:border-b-0 active:translate-y-1 disabled:opacity-40 flex items-center justify-center gap-1"><ChevronLeft className="w-6 h-6" /><span className="hidden sm:inline lg:hidden xl:inline">Atrás</span></button>
                                <div className="bg-[#7c3aed] text-white font-black px-2 text-sm sm:text-base flex items-center justify-center border-b-4 border-[#4c1d95] whitespace-nowrap">{step + 1}/{maxS + 1}</div>
                                <button onClick={next} className={`flex-[2] rounded-r-2xl text-white font-black text-base sm:text-lg border-b-4 active:border-b-0 active:translate-y-1 flex items-center justify-center gap-1 ${step === maxS ? 'bg-gradient-to-r from-[#10b981] to-[#047857] border-[#065f46] animate-pulse' : 'bg-gradient-to-r from-[#ff2e93] to-[#ff9a00] border-[#b4235f]'}`}>{step < maxS ? '¡Siguiente paso!' : (onDone ? 'Siguiente ejercicio' : 'Repetir')}<ChevronRight className="w-6 h-6" /></button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // =========================================================================
        // 6. ACTIVIDAD 1: TEORÍA ANIMADA DE LOS CASOS
        // =========================================================================
        function TeoriaSection() {
            const [ci, setCi] = useState(0);
            const c = THEORY_CASES[ci];
            return (
                <div className="grid lg:grid-cols-[1fr_2.2fr] gap-4 lg:gap-5">
                    <div className="flex flex-col gap-3">
                        <NeonCard className="p-4 border-[#ffe600]/60">
                            <div className="inline-block px-3 py-1 rounded-full bg-[#ffe600] text-[#0a0322] font-black text-sm">📌 Recordemos</div>
                            <p className="mt-2 text-white font-bold text-base leading-snug">Cuando queda un <b className="text-[#ff3df2]">resto distinto de cero</b>, se añade un <b className="text-[#ffe600]">cero al resto</b> y una <b className="text-[#00f0ff]">coma en el cociente</b> para seguir dividiendo.</p>
                        </NeonCard>
                        <div className="grid grid-cols-2 lg:grid-cols-1 gap-2.5">
                            {THEORY_CASES.map((t, i) => (
                                <button key={t.id} onClick={() => { sfx('swoosh'); setCi(i); }}
                                    className={`text-left rounded-2xl p-3 border-2 transition-all active:scale-95 ${ci === i ? 'bg-gradient-to-r from-[#ff2e93] to-[#7c3aed] border-white shadow-[0_0_22px_rgba(255,61,242,0.6)]' : 'bg-white/10 border-white/25 hover:bg-white/20'}`}>
                                    <div className="font-black text-white text-base sm:text-lg">{t.icon} {t.title}</div>
                                    <div className="text-white/80 font-bold text-sm">Ej.: {fmtStr(t.a)} ÷ {fmtStr(t.b)}</div>
                                </button>
                            ))}
                        </div>
                        <NeonCard className="p-4">
                            <div className="text-[#00f0ff] font-black text-sm uppercase tracking-wider">La regla</div>
                            <p className="text-white font-bold text-base leading-snug mt-1">{c.rule}</p>
                        </NeonCard>
                    </div>
                    <DivisionStepper key={c.id} a={c.a} b={c.b}
                        header={<><span className="px-2.5 py-1 rounded-lg text-xs sm:text-sm font-black text-white bg-gradient-to-r from-[#ff2e93] to-[#7c3aed]">{c.icon} Caso: {c.title}</span><div className="mt-1.5 text-xl sm:text-2xl font-black text-white">Dividimos {fmtStr(c.a)} ÷ {fmtStr(c.b)}</div></>}
                        onDone={() => setCi((ci + 1) % THEORY_CASES.length)} />
                </div>
            );
        }

        // =========================================================================
        // 7. ACTIVIDAD 2: EJERCICIOS DEL LIBRO PASO A PASO
        // =========================================================================
        function LibroSection() {
            const [i, setI] = useState(0);
            const ex = BOOK[i];
            return (
                <div className="flex flex-col gap-3">
                    <div className="flex gap-2 overflow-x-auto scrollbar-hide pb-1">
                        {BOOK.map((e, k) => <Pill key={e.id} active={i === k} grad="from-[#ffe600] to-[#ff8a00]" dark onClick={() => { sfx('pop'); setI(k); }}>{e.emoji ? e.emoji + ' ' : ''}Ejercicio {e.tag}</Pill>)}
                    </div>
                    <DivisionStepper key={ex.id} a={ex.a} b={ex.b} pre={ex.pre || []} post={ex.post || []} accent="#ffe600"
                        header={<><span className="px-2.5 py-1 rounded-lg text-xs sm:text-sm font-black text-[#0a0322] bg-gradient-to-r from-[#ffe600] to-[#ff8a00]">📘 Libro · Ejercicio {ex.tag}</span>
                            <div className="mt-1.5 text-lg sm:text-2xl font-bold text-white leading-snug"><RichText text={ex.text} /></div></>}
                        onDone={() => setI((i + 1) % BOOK.length)} />
                </div>
            );
        }

        // =========================================================================
        // 8. ACTIVIDAD 3: ¡SAL A LA PIZARRA! (GENERADOR + GALERA GUIADA)
        // =========================================================================
        const LEVELS = [
            { key: 'facil', name: '🟢 Fácil', desc: 'decimal ÷ entero', grad: 'from-[#c6ff00] to-[#00d68f]' },
            { key: 'medio', name: '🟡 Medio', desc: 'divisor de 2 cifras, resto ≠ 0, entero ÷ decimal', grad: 'from-[#ffe600] to-[#ff8a00]' },
            { key: 'dificil', name: '🔴 Difícil', desc: 'decimal ÷ decimal', grad: 'from-[#ff2e63] to-[#b14bff]' }
        ];
        function buildTasks(div) {
            const frames = galeraFrames(div);
            const tasks = [];
            if (div.k > 0) tasks.push({ type: 'shift', answer: String(div.k), frame: -1 });
            div.cycles.forEach((c, i) => {
                const fq = frames.findIndex(f => f.kind === 'q' && f.ci === i);
                tasks.push({ type: 'q', ci: i, answer: String(c.q), frame: fq - 1, after: fq });
                if (c.q > 0) {
                    const fm = frames.findIndex(f => f.kind === 'mult' && f.ci === i);
                    tasks.push({ type: 'rem', ci: i, answer: String(c.rem), frame: fm });
                }
            });
            return { frames, tasks };
        }

        function PizarraSection() {
            const [level, setLevel] = useState('facil');
            const [mode, setMode] = useState('guiado');
            const [prob, setProb] = useState(() => genDivision('facil'));
            const div = useMemo(() => makeDivision(prob.a, prob.b), [prob]);
            const { frames, tasks } = useMemo(() => buildTasks(div), [div]);
            const [ti, setTi] = useState(0);
            const [val, setVal] = useState('');
            const [state, setState] = useState('idle');
            const [fails, setFails] = useState(0);
            const [stars, setStars] = useState(0);
            const [solved, setSolved] = useState(0);
            const [msg, setMsg] = useState('');
            const [confetti, fire] = useConfetti();

            const reset = (p) => { setProb(p); setTi(0); setVal(''); setState('idle'); setFails(0); setMsg(''); };
            const nuevo = (lv = level) => { sfx('swoosh'); reset(genDivision(lv)); };
            const done = mode === 'guiado' ? ti >= tasks.length : state === 'ok';
            const task = tasks[ti];
            const c = task && task.ci !== undefined ? div.cycles[task.ci] : null;

            const prompt = done ? '' : mode === 'directo' ? `Escribe el cociente de ${fmtStr(prob.a)} ÷ ${fmtStr(prob.b)}` :
                task.type === 'shift' ? `¿Cuántos lugares corremos la coma para que el divisor ${fmtStr(prob.b)} sea entero?` :
                task.type === 'q' ? `¿Cuántas veces cabe ${div.d} en ${c.cur}? Escribe la cifra del cociente.` :
                `Resta: ${c.cur} − ${c.prod} = ? Escribe el resto.`;
            const hint = () => {
                if (mode === 'directo') {
                    const qd = normDec(parseDec(prob.q)); const ent = Math.floor(qd.n / 10 ** qd.d);
                    return `Pista: estima. ${fmtStr(prob.a)} ÷ ${fmtStr(prob.b)} es un poco más de ${ent}. ¡Usa la galera guiada si lo necesitas!`;
                }
                if (task.type === 'shift') return `Pista: cuenta las cifras que hay después de la coma en ${fmtStr(prob.b)}.`;
                if (task.type === 'q') { const q = c.q; return q === 0 ? `Pista: ${div.d} es mayor que ${c.cur}, así que no cabe ninguna vez.` : `Pista: ${div.d} × ${q} = ${div.d * q} y ${div.d} × ${q + 1} = ${div.d * (q + 1)}. ¿Cuál no se pasa de ${c.cur}?`; }
                return `Pista: a ${c.cur} le quitamos ${c.prod}.`;
            };
            const check = () => {
                AudioController.init(); AudioController.startBGM();
                let ok;
                if (mode === 'directo') ok = decEq(parseDec(val), parseDec(prob.q));
                else ok = val === task.answer;
                if (ok) {
                    setState('ok'); sfx('success');
                    if (fails === 0) setStars(s => s + 1);
                    if (mode === 'directo') { setSolved(s => s + 1); fire(); setMsg(`¡Correcto! ${fmtStr(prob.a)} ÷ ${fmtStr(prob.b)} = ${fmtStr(prob.q)} 🎉`); return; }
                    const n = ti + 1;
                    setTimeout(() => { setTi(n); setVal(''); setState('idle'); setFails(0); if (n < tasks.length) setMsg(''); }, 650);
                    if (n >= tasks.length) { setSolved(s => s + 1); fire(); setMsg(`¡Excelente! Resolviste ${fmtStr(prob.a)} ÷ ${fmtStr(prob.b)} = ${fmtStr(prob.q)} 🎉`); }
                    else setMsg(task.type === 'shift' ? `¡Sí! Corremos la coma ${task.answer} lugar(es). Ahora dividimos ${fmtDec({ n: Number(div.N), d: div.dn })} ÷ ${div.d}.` : '¡Muy bien! ✅');
                } else {
                    setState('bad'); sfx('pop-reverse');
                    const f = fails + 1; setFails(f);
                    let m = f >= 2 ? hint() : '¡Casi! Inténtalo otra vez. 💪';
                    if (mode === 'directo') {
                        const v = parseDec(val);
                        if (v && String(normDec(v).n) === String(normDec(parseDec(prob.q)).n)) m = '¡Las cifras están bien! Revisa dónde va la coma. 😉';
                    }
                    setMsg(m);
                    setTimeout(() => setState('idle'), 500);
                }
            };

            // Qué mostramos en la galera
            let frame = null, pendingQ = false, pendingRem = null, phase = 'before';
            if (mode === 'directo') { frame = state === 'ok' ? frames[frames.length - 1] : null; phase = state === 'ok' ? 'after' : 'before'; }
            else if (done) { frame = frames[frames.length - 1]; phase = 'after'; }
            else if (task.type === 'shift') { frame = null; phase = 'before'; }
            else {
                phase = 'after';
                frame = frames[Math.max(task.frame, 0)];
                if (task.type === 'q') pendingQ = true;
                if (task.type === 'rem') pendingRem = { endCol: c.endCol };
            }
            const robot = msg || (done ? '' : (frame && mode === 'guiado' && task.type !== 'shift' ? frame.msg.replace(/¿Cuántas veces.*$/, '') + ' ' : '') + prompt);

            return (
                <div className="flex flex-col gap-3">
                    {confetti}
                    <div className="flex flex-wrap gap-2 items-center justify-between">
                        <div className="flex gap-2 overflow-x-auto scrollbar-hide">
                            {LEVELS.map(l => <Pill key={l.key} active={level === l.key} grad={l.grad} dark={l.key !== 'dificil'} onClick={() => { setLevel(l.key); nuevo(l.key); }}>{l.name}</Pill>)}
                        </div>
                        <div className="flex gap-2 items-center">
                            <Pill active={mode === 'guiado'} grad="from-[#00c2ff] to-[#7c3aed]" onClick={() => { sfx('pop'); setMode('guiado'); reset(prob); }}>🧭 Galera guiada</Pill>
                            <Pill active={mode === 'directo'} grad="from-[#ff2e93] to-[#ff9a00]" onClick={() => { sfx('pop'); setMode('directo'); reset(prob); }}>⚡ Respuesta directa</Pill>
                            <div className="px-3 py-2 rounded-2xl bg-[#ffe600] text-[#0a0322] font-black text-base whitespace-nowrap">⭐ {stars} · ✅ {solved}</div>
                        </div>
                    </div>
                    <div className="grid lg:grid-cols-[1.6fr_1fr] gap-4 lg:gap-5">
                        <div className="relative flex flex-col rounded-[1.6rem] overflow-hidden bg-white border-[5px] border-white shadow-[0_0_0_3px_rgba(255,61,242,0.75),0_25px_55px_rgba(0,0,0,0.5)] min-h-[28rem] lg:min-h-[calc(100dvh-14rem)]">
                            <DrawingCanvas />
                            <div className="shrink-0 bg-[#0a0322] px-4 pt-12 sm:pt-3 pb-3 border-b-4 border-[#ff3df2]">
                                <div className="sm:pr-72">
                                    <span className="px-2.5 py-1 rounded-lg text-xs sm:text-sm font-black text-white bg-gradient-to-r from-[#ff2e93] to-[#7c3aed]">🧑‍🏫 ¡Sal a la pizarra! · {LEVELS.find(l => l.key === level).name} · {prob.kind}</span>
                                    <div className="mt-1.5 text-2xl sm:text-3xl font-black text-white">Divide: <span className="text-[#ffe600]">{fmtStr(prob.a)} ÷ {fmtStr(prob.b)}</span></div>
                                </div>
                            </div>
                            <div className="flex-1 relative bg-slate-50 p-4 flex flex-col items-center gap-4 overflow-hidden">
                                <div className="absolute inset-0 opacity-[0.05] pointer-events-none bg-[radial-gradient(#0f172a_1.5px,transparent_1.5px)] [background-size:20px_20px]" />
                                {div.k > 0 && <div className="relative w-full rounded-2xl bg-white border-2 border-slate-200 py-2 shadow-sm"><ComaShift div={div} phase={phase} size={2.4} /></div>}
                                <div className="relative w-full flex justify-center py-2">
                                    {frame || pendingQ ? <Galera div={div} frame={frame} pendingQ={pendingQ} pendingRem={pendingRem} size={galeraSize(frames, 3.6, 22)} />
                                        : <div className="text-slate-400 font-black text-xl py-12 text-center">{mode === 'directo' ? '✍️ Resuelve en tu cuaderno o con el lápiz y escribe el cociente' : '👉 Primero, la coma'}</div>}
                                </div>
                            </div>
                        </div>
                        <div className="flex flex-col gap-3">
                            <RobotSays text={robot || '¡Lista la división!'} highlight={!done} step={done ? 1 : 0} maxSteps={1} />
                            {!done ? (
                                <NeonCard className="p-4 flex flex-col gap-3">
                                    <div className="text-white font-black text-lg leading-snug">{prompt}</div>
                                    <Display value={val} state={state} />
                                    <Keypad value={val} onChange={setVal} onOk={check} allowComma={mode === 'directo'} maxLen={mode === 'directo' ? 9 : 4} />
                                    <div className="flex gap-2">
                                        <BigBtn kind="ghost" className="flex-1" onClick={() => { sfx('pop'); setMsg(hint()); }}>💡 Pista</BigBtn>
                                        <BigBtn kind="ghost" className="flex-1" onClick={() => nuevo()}>🔄 Otra</BigBtn>
                                    </div>
                                </NeonCard>
                            ) : (
                                <NeonCard className="p-6 text-center flex flex-col items-center gap-3">
                                    <div className="text-6xl">🏆</div>
                                    <div className="text-white font-black text-2xl">{fmtStr(prob.a)} ÷ {fmtStr(prob.b)} = <span className="text-[#c6ff00]">{fmtStr(prob.q)}</span></div>
                                    <BigBtn kind="hot" className="w-full text-xl min-h-[4rem]" onClick={() => nuevo()}>🎲 ¡Siguiente alumno! Nueva división</BigBtn>
                                </NeonCard>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        // =========================================================================
        // 9. ACTIVIDAD 4: APLICACIONES EN CONTEXTO PERUANO
        // =========================================================================
        function AppsSection() {
            const [i, setI] = useState(null);
            const [val, setVal] = useState('');
            const [state, setState] = useState('idle');
            const [show, setShow] = useState(false);
            const [okSet, setOkSet] = useState({});
            const [confetti, fire] = useConfetti();
            const open = (k) => { sfx('swoosh'); setI(k); setVal(''); setState('idle'); setShow(false); };
            if (i === null) {
                return (
                    <div className="flex flex-col gap-3">
                        <div className="text-white font-black text-xl sm:text-2xl">🇵🇪 Problemas de la vida diaria · <span className="text-white/70 text-base sm:text-lg">elige uno y ¡a resolver!</span></div>
                        <div className="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-4">
                            {APPS.map((p, k) => (
                                <button key={p.id} onClick={() => open(k)} className="relative text-left p-4 rounded-[1.6rem] bg-white/10 border-[3px] border-white/25 hover:border-white hover:-translate-y-1 transition-all overflow-hidden" style={{ boxShadow: `0 0 26px ${p.color}55` }}>
                                    <div className="absolute -right-4 -top-4 w-24 h-24 rounded-full blur-2xl opacity-60" style={{ background: p.color }} />
                                    <div className="flex items-center gap-3">
                                        <div className="w-16 h-16 shrink-0 rounded-2xl flex items-center justify-center text-4xl border-2 border-white/60" style={{ background: `linear-gradient(135deg, ${p.color}, #1b0a52)` }}>{p.emoji}</div>
                                        <div className="font-black text-white text-lg leading-tight">{p.title}</div>
                                        {okSet[p.id] && <span className="ml-auto text-2xl">✅</span>}
                                    </div>
                                    <p className="relative mt-2 text-white/90 font-semibold text-sm sm:text-base leading-snug"><RichText text={p.text} /></p>
                                </button>
                            ))}
                        </div>
                    </div>
                );
            }
            const p = APPS[i];
            const check = () => {
                if (decEq(parseDec(val), parseDec(p.answer))) { setState('ok'); sfx('success'); fire(); setOkSet(s => ({ ...s, [p.id]: true })); }
                else { setState('bad'); sfx('pop-reverse'); setTimeout(() => setState('idle'), 500); }
            };
            return (
                <div className="flex flex-col gap-3">
                    {confetti}
                    <div className="flex gap-2 flex-wrap">
                        <BigBtn kind="ghost" onClick={() => { sfx('pop'); setI(null); }}><ChevronLeft className="w-5 h-5" /> Todos los problemas</BigBtn>
                        <BigBtn kind="cool" onClick={() => open((i + 1) % APPS.length)}>Siguiente problema <ChevronRight className="w-5 h-5" /></BigBtn>
                    </div>
                    {!show ? (
                        <div className="grid lg:grid-cols-[1.4fr_1fr] gap-4 lg:gap-5">
                            <NeonCard className="p-5 sm:p-7 flex flex-col items-center text-center gap-4 justify-center" >
                                <div className="w-32 h-32 sm:w-44 sm:h-44 rounded-[2rem] flex items-center justify-center text-7xl sm:text-8xl border-4 border-white animate-robotFloat" style={{ background: `linear-gradient(135deg, ${p.color}, #1b0a52)`, boxShadow: `0 0 40px ${p.color}` }}>{p.emoji}</div>
                                <div className="text-2xl sm:text-4xl font-black text-white">{p.title}</div>
                                <p className="text-white font-bold text-lg sm:text-2xl leading-snug max-w-3xl"><RichText text={p.text} /></p>
                                <div className="px-4 py-2 rounded-2xl bg-white/10 border border-white/30 text-white font-black text-lg sm:text-xl">Planteamos: <span className="text-[#ffe600]">{fmtStr(p.a, { strip: false })} ÷ {fmtStr(p.b)}</span></div>
                                {state === 'ok' && <div className="text-[#c6ff00] font-black text-xl sm:text-2xl animate-slideInRight">✅ ¡Correcto! {p.say}</div>}
                            </NeonCard>
                            <NeonCard className="p-4 flex flex-col gap-3">
                                <div className="text-white font-black text-lg">Tu respuesta</div>
                                <Display value={val} state={state} prefix={p.unitPos === 'pre' ? p.unit : ''} suffix={p.unitPos === 'post' ? p.unit : ''} />
                                <Keypad value={val} onChange={setVal} onOk={check} disabled={state === 'ok'} />
                                <BigBtn kind="lime" onClick={() => { sfx('swoosh'); setShow(true); }}>👀 Ver la solución en galera</BigBtn>
                            </NeonCard>
                        </div>
                    ) : (
                        <DivisionStepper key={p.id} a={p.a} b={p.b} accent={p.color}
                            post={[{ badge: 'Respuesta', latex: `\\boxed{\\text{${p.say}}}`, msg: `${p.say} 🎉` }]}
                            header={<><span className="px-2.5 py-1 rounded-lg text-xs sm:text-sm font-black text-white" style={{ background: p.color }}>{p.emoji} {p.title}</span><div className="mt-1.5 text-lg sm:text-2xl font-bold text-white leading-snug"><RichText text={p.text} /></div></>}
                            onDone={() => open((i + 1) % APPS.length)} />
                    )}
                </div>
            );
        }

        // =========================================================================
        // 10. ACTIVIDAD 5: ¿DÓNDE VA LA COMA? (ESTIMACIÓN)
        // =========================================================================
        function ComaSection() {
            const [g, setG] = useState(() => genComaGame());
            const [chosen, setChosen] = useState(null);
            const [streak, setStreak] = useState(0);
            const [best, setBest] = useState(0);
            const [confetti, fire] = useConfetti();
            const digits = g.digits.split('');
            const q = normDec(parseDec(g.q));
            const ent = Math.floor(q.n / 10 ** q.d);
            const choose = (s) => {
                if (chosen !== null) return;
                AudioController.init(); AudioController.startBGM();
                setChosen(s);
                if (s === g.slot) { sfx('success'); const n = streak + 1; setStreak(n); setBest(b => Math.max(b, n)); if (n % 3 === 0) fire(); }
                else { sfx('pop-reverse'); setStreak(0); }
            };
            const next = () => { sfx('swoosh'); setG(genComaGame()); setChosen(null); };
            const shown = chosen === null ? null : chosen;
            return (
                <div className="grid lg:grid-cols-[1.6fr_1fr] gap-4 lg:gap-5">
                    {confetti}
                    <NeonCard className="p-5 sm:p-8 flex flex-col items-center gap-6">
                        <div className="text-white/80 font-black text-base sm:text-lg uppercase tracking-wider">¿Dónde va la coma? Toca el espacio correcto 👆</div>
                        <div className="font-black text-white text-4xl sm:text-6xl text-center">{fmtStr(g.a)} <span className="text-[#ff3df2]">÷</span> {fmtStr(g.b)} =</div>
                        <div className="flex items-center justify-center flex-wrap">
                            {digits.map((dg, k) => (
                                <React.Fragment key={k}>
                                    <div className="w-14 h-20 sm:w-20 sm:h-28 rounded-2xl bg-white text-[#1b0a52] font-black text-5xl sm:text-7xl flex items-center justify-center shadow-[0_0_20px_rgba(0,240,255,0.5)] border-4 border-[#00f0ff]">{dg}</div>
                                    {k < digits.length - 1 && (
                                        <button onClick={() => choose(k + 1)} className={`w-9 sm:w-12 h-20 sm:h-28 mx-0.5 rounded-xl flex items-end justify-center font-black text-6xl sm:text-8xl leading-none transition-all ${shown === k + 1 ? (k + 1 === g.slot ? 'text-[#c6ff00] coma-hop' : 'text-[#ff2e63] animate-shake') : chosen !== null && k + 1 === g.slot ? 'text-[#c6ff00]/70' : 'text-white/0 hover:text-white/40 bg-white/5 hover:bg-white/15 border-2 border-dashed border-white/30'}`}>,</button>
                                    )}
                                </React.Fragment>
                            ))}
                        </div>
                        <button onClick={() => choose(digits.length)} className={`px-5 py-3 rounded-2xl font-black text-lg sm:text-xl border-2 transition-all ${shown === digits.length ? (g.slot === digits.length ? 'bg-[#c6ff00] text-[#0a0322] border-white' : 'bg-[#ff2e63] text-white border-white animate-shake') : chosen !== null && g.slot === digits.length ? 'bg-[#c6ff00]/70 text-[#0a0322] border-white' : 'bg-white/10 text-white border-white/30 hover:bg-white/20'}`}>🚫 No lleva coma (es entero)</button>
                        {chosen !== null && (
                            <div className="w-full rounded-2xl bg-white p-4 text-center animate-slideInRight">
                                <div className={`font-black text-2xl sm:text-3xl ${chosen === g.slot ? 'text-[#047857]' : 'text-[#be123c]'}`}>{chosen === g.slot ? '¡Correcto! 🎉' : '¡Uy! Casi 😅'} {fmtStr(g.a)} ÷ {fmtStr(g.b)} = <QuotientText q={fmtStr(g.q)} /></div>
                                <div className="mt-1 text-slate-700 font-bold text-base sm:text-lg">💡 Estimamos: {fmtStr(g.a)} ÷ {fmtStr(g.b)} es un poco más de <b>{ent}</b>, así que el cociente tiene {String(ent).length} cifra{String(ent).length > 1 ? 's' : ''} entera{String(ent).length > 1 ? 's' : ''}{g.slot === digits.length ? ' y no le sobra nada: es entero.' : '.'}</div>
                                <BigBtn kind="hot" className="mt-3 mx-auto text-xl min-h-[3.6rem]" onClick={next}>Siguiente <ChevronRight className="w-6 h-6" /></BigBtn>
                            </div>
                        )}
                    </NeonCard>
                    <div className="flex flex-col gap-3">
                        <NeonCard className="p-5 text-center">
                            <div className="text-white/70 font-black uppercase tracking-wider text-sm">Racha</div>
                            <div className="text-6xl font-black neon-text">{streak} 🔥</div>
                            <div className="text-white/80 font-bold">Mejor racha: {best}</div>
                        </NeonCard>
                        <RobotSays text={chosen === null ? 'Truco: estima primero. Redondea el dividendo y el divisor, divide mentalmente y así sabrás cuántas cifras enteras tiene el cociente.' : chosen === g.slot ? '¡Así se hace! Estimar te ayuda a comprobar si la coma está bien puesta.' : `Fíjate: el resultado debe estar cerca de ${ent}. ¡Con la estimación lo descubres!`} highlight={chosen === null} step={chosen === g.slot ? 1 : 0} maxSteps={1} />
                    </div>
                </div>
            );
        }

        // =========================================================================
        // 11. ACTIVIDAD 6: COMPETENCIA POR EQUIPOS
        // =========================================================================
        const TEAMS = [
            { name: 'Llamas', emoji: '🦙', color: '#ff2e63' },
            { name: 'Cóndores', emoji: '🦅', color: '#00c2ff' },
            { name: 'Pumas', emoji: '🐆', color: '#39ff14' },
            { name: 'Delfines', emoji: '🐬', color: '#ffe600' }
        ];
        function CompetenciaSection() {
            const [cfg, setCfg] = useState({ teams: 2, rounds: 3, time: 30 });
            const [game, setGame] = useState(null);
            const [confetti, fire] = useConfetti();
            const start = () => {
                AudioController.init(); AudioController.startBGM(); sfx('swoosh');
                setGame({ scores: Array(cfg.teams).fill(0), turn: 0, total: cfg.teams * cfg.rounds, q: genQuickQuestion(), left: cfg.time, answer: null, gain: 0, over: false });
            };
            useEffect(() => {
                if (!game || game.answer !== null || game.over) return;
                const t = setInterval(() => setGame(g => {
                    if (!g || g.answer !== null) return g;
                    if (g.left <= 1) { AudioController.play('pop-reverse'); return { ...g, left: 0, answer: '__timeout', gain: 0 }; }
                    if (g.left <= 6) AudioController.play('hover');
                    return { ...g, left: g.left - 1 };
                }), 1000);
                return () => clearInterval(t);
            }, [game && game.turn, game && game.answer, game && game.over]);
            const answer = (opt) => {
                if (!game || game.answer !== null) return;
                const ok = opt === game.q.answer;
                const gain = ok ? 10 + (game.left >= cfg.time / 2 ? 5 : 0) : 0;
                if (ok) { sfx('success'); } else sfx('pop-reverse');
                const scores = game.scores.slice(); scores[game.turn % cfg.teams] += gain;
                setGame({ ...game, answer: opt, gain, scores });
            };
            const nextTurn = () => {
                const n = game.turn + 1;
                if (n >= game.total) { setGame({ ...game, over: true }); fire(); sfx('success'); return; }
                sfx('swoosh');
                setGame({ ...game, turn: n, q: genQuickQuestion(), left: cfg.time, answer: null, gain: 0 });
            };
            const Opt = ({ label, onClick, active }) => <button onClick={onClick} className={`px-4 py-2.5 rounded-2xl font-black text-lg border-2 ${active ? 'bg-[#ffe600] text-[#0a0322] border-white' : 'bg-white/10 text-white border-white/30 hover:bg-white/20'}`}>{label}</button>;

            if (!game) {
                return (
                    <NeonCard className="p-6 sm:p-8 max-w-4xl mx-auto w-full flex flex-col gap-6">
                        <div className="text-center"><div className="text-6xl">🏆</div><div className="text-3xl sm:text-4xl font-black text-white">Competencia por equipos</div><p className="text-white/80 font-bold text-lg mt-1">Por turnos, cada equipo sale a la pizarra y responde. ¡+10 puntos por acierto y +5 extra si responden en la primera mitad del tiempo!</p></div>
                        <div><div className="text-white font-black text-lg mb-2">¿Cuántos equipos?</div><div className="flex gap-2 flex-wrap">{[2, 3, 4].map(n => <Opt key={n} label={`${n} equipos`} active={cfg.teams === n} onClick={() => { sfx('pop'); setCfg({ ...cfg, teams: n }); }} />)}</div>
                            <div className="flex gap-2 flex-wrap mt-3">{TEAMS.slice(0, cfg.teams).map(t => <span key={t.name} className="px-3 py-1.5 rounded-xl font-black text-[#0a0322]" style={{ background: t.color }}>{t.emoji} {t.name}</span>)}</div></div>
                        <div><div className="text-white font-black text-lg mb-2">Preguntas por equipo</div><div className="flex gap-2 flex-wrap">{[3, 5, 8].map(n => <Opt key={n} label={`${n}`} active={cfg.rounds === n} onClick={() => { sfx('pop'); setCfg({ ...cfg, rounds: n }); }} />)}</div></div>
                        <div><div className="text-white font-black text-lg mb-2">Tiempo por pregunta</div><div className="flex gap-2 flex-wrap">{[20, 30, 45, 60].map(n => <Opt key={n} label={`${n} s`} active={cfg.time === n} onClick={() => { sfx('pop'); setCfg({ ...cfg, time: n }); }} />)}</div></div>
                        <BigBtn kind="hot" className="text-2xl min-h-[4.5rem]" onClick={start}>🚀 ¡Empezar la competencia!</BigBtn>
                    </NeonCard>
                );
            }
            const ti = game.turn % cfg.teams, team = TEAMS[ti];
            if (game.over) {
                const order = game.scores.map((s, i) => ({ s, i })).sort((x, y) => y.s - x.s);
                const top = order[0].s; const winners = order.filter(o => o.s === top);
                return (
                    <NeonCard className="p-6 sm:p-10 max-w-4xl mx-auto w-full text-center flex flex-col gap-5">
                        {confetti}
                        <div className="text-7xl">🏆</div>
                        <div className="text-3xl sm:text-5xl font-black text-white">{winners.length > 1 ? '¡Empate!' : `¡Ganan los ${TEAMS[winners[0].i].name}!`} {winners.map(w => TEAMS[w.i].emoji).join(' ')}</div>
                        <div className="flex flex-col gap-2.5">
                            {order.map((o, k) => <div key={o.i} className="flex items-center justify-between px-5 py-3 rounded-2xl font-black text-xl sm:text-2xl text-[#0a0322]" style={{ background: TEAMS[o.i].color, transform: k === 0 ? 'scale(1.04)' : 'none' }}><span>{['🥇', '🥈', '🥉', '4.º'][k]} {TEAMS[o.i].emoji} {TEAMS[o.i].name}</span><span>{o.s} pts</span></div>)}
                        </div>
                        <div className="flex gap-3 justify-center flex-wrap"><BigBtn kind="hot" onClick={start}>🔁 Revancha</BigBtn><BigBtn kind="ghost" onClick={() => setGame(null)}>⚙️ Cambiar equipos</BigBtn></div>
                    </NeonCard>
                );
            }
            const pct = (game.left / cfg.time) * 100;
            return (
                <div className="flex flex-col gap-4">
                    <div className={`grid gap-3 ${cfg.teams === 2 ? 'grid-cols-2' : cfg.teams === 3 ? 'grid-cols-3' : 'grid-cols-2 lg:grid-cols-4'}`}>
                        {game.scores.map((s, i) => (
                            <div key={i} className={`rounded-2xl px-4 py-3 border-4 flex items-center justify-between transition-all ${i === ti ? 'scale-[1.04]' : 'opacity-70'}`} style={{ borderColor: TEAMS[i].color, background: i === ti ? TEAMS[i].color : 'rgba(255,255,255,0.08)', color: i === ti ? '#0a0322' : '#fff', boxShadow: i === ti ? `0 0 30px ${TEAMS[i].color}` : 'none' }}>
                                <span className="font-black text-lg sm:text-2xl">{TEAMS[i].emoji} {TEAMS[i].name}</span><span className="font-black text-2xl sm:text-4xl tabular-nums">{s}</span>
                            </div>
                        ))}
                    </div>
                    <NeonCard className="p-5 sm:p-8 flex flex-col gap-5">
                        <div className="flex items-center justify-between gap-3 flex-wrap">
                            <div className="px-4 py-2 rounded-2xl font-black text-xl text-[#0a0322]" style={{ background: team.color }}>Turno: {team.emoji} {team.name}</div>
                            <div className="text-white/80 font-black text-lg">Pregunta {game.turn + 1} de {game.total}</div>
                            <div className={`w-20 h-20 sm:w-24 sm:h-24 rounded-full flex items-center justify-center font-black text-3xl sm:text-4xl ${game.left <= 5 && game.answer === null ? 'animate-timer text-white' : 'text-[#0a0322]'}`} style={{ background: `conic-gradient(${game.left <= 5 ? '#ff2e63' : '#c6ff00'} ${pct}%, rgba(255,255,255,0.15) 0)` }}>
                                <div className="w-[78%] h-[78%] rounded-full bg-[#140a3a] text-white flex items-center justify-center">{game.left}</div>
                            </div>
                        </div>
                        <div className="text-white font-black text-2xl sm:text-4xl text-center leading-snug">{game.q.prompt}</div>
                        <div className="grid grid-cols-2 gap-3 sm:gap-4">
                            {game.q.options.map((o, k) => {
                                const isAns = o === game.q.answer, picked = game.answer === o, reveal = game.answer !== null;
                                const base = ['from-[#ff2e93] to-[#ff5f6d]', 'from-[#00c2ff] to-[#3a5bff]', 'from-[#ffb800] to-[#ff8a00]', 'from-[#8b5cf6] to-[#b14bff]'][k % 4];
                                return (
                                    <button key={o + k} onClick={() => answer(o)} disabled={reveal}
                                        className={`min-h-[5rem] sm:min-h-[6.5rem] rounded-3xl font-black text-3xl sm:text-5xl text-white border-b-[6px] border-black/30 transition-all active:translate-y-1 bg-gradient-to-br ${reveal ? (isAns ? 'from-[#10b981] to-[#047857] ring-4 ring-white scale-[1.03]' : picked ? 'from-[#be123c] to-[#7f1d1d] animate-shake' : `${base} opacity-40`) : base}`}>
                                        {['▲', '◆', '●', '■'][k]} {game.q.type === 'coma' ? `${o} lugar${o === '1' ? '' : 'es'}` : fmtStr(o)}
                                    </button>
                                );
                            })}
                        </div>
                        {game.answer !== null && (
                            <div className="flex flex-col sm:flex-row items-center gap-4 justify-between rounded-2xl bg-white p-4 animate-slideInRight">
                                <div className="font-black text-xl sm:text-2xl text-[#1b0a52]">
                                    {game.answer === '__timeout' ? '⏰ ¡Se acabó el tiempo!' : game.gain > 0 ? `✅ ¡Correcto! +${game.gain} puntos${game.gain > 10 ? ' (¡rápido!)' : ''}` : '❌ ¡Uy! Esta vez no.'}
                                    <span className="text-slate-600"> La respuesta es {game.q.type === 'coma' ? `${game.q.answer} lugar${game.q.answer === '1' ? '' : 'es'}` : fmtStr(game.q.answer)}.</span>
                                </div>
                                <BigBtn kind="cool" className="text-xl min-h-[3.6rem] w-full sm:w-auto" onClick={nextTurn}>{game.turn + 1 >= game.total ? '🏁 Ver resultados' : 'Siguiente turno'} <ChevronRight className="w-6 h-6" /></BigBtn>
                            </div>
                        )}
                    </NeonCard>
                </div>
            );
        }

        // =========================================================================
        // 12. APLICACIÓN PRINCIPAL
        // =========================================================================
        const TABS = [
            { key: 'teoria', title: '1 · Teoría animada', icon: '🎬', grad: 'from-[#00f5ff] to-[#3a5bff]', desc: 'Los 4 casos: decimal ÷ entero, entero ÷ decimal, decimal ÷ decimal y resto ≠ 0, con la coma que salta y la galera paso a paso.' },
            { key: 'libro', title: '2 · Ejercicios del libro', icon: '📘', grad: 'from-[#ffe600] to-[#ff8a00]', dark: true, desc: 'Los 9 ejercicios de tu libro resueltos en galera animada, con «¡Siguiente paso!».' },
            { key: 'pizarra', title: '3 · ¡Sal a la pizarra!', icon: '🧑‍🏫', grad: 'from-[#ff2e93] to-[#7c3aed]', desc: 'Divisiones al azar (fácil, medio, difícil). El alumno escribe cada cifra del cociente y cada resto con el teclado gigante.' },
            { key: 'apps', title: '4 · Aplicaciones', icon: '🛒', grad: 'from-[#c6ff00] to-[#00d68f]', dark: true, desc: 'Problemas con soles, litros, metros y kilos: el pan, el pollo, la chicha morada, la combi…' },
            { key: 'coma', title: '5 · ¿Dónde va la coma?', icon: '🎯', grad: 'from-[#ff3df2] to-[#b14bff]', desc: 'Juego de estimación: toca el lugar exacto de la coma en el cociente. ¡Haz tu racha!' },
            { key: 'equipos', title: '6 · Competencia', icon: '🏆', grad: 'from-[#ff8a00] to-[#ff2e63]', desc: 'De 2 a 4 equipos, con marcador, temporizador y preguntas rápidas en la pantalla.' }
        ];
        const BrandBadge = ({ small }) => (
            <div className={`inline-flex items-center gap-2 rounded-2xl border-2 border-[#ffe600] bg-white/10 backdrop-blur-md text-[#ffe600] font-black uppercase tracking-wider shadow-[0_0_16px_rgba(255,230,0,0.45)] ${small ? 'px-2.5 py-1.5 text-xs' : 'px-4 py-2 text-sm sm:text-base'}`}>
                <Rocket className={small ? 'w-4 h-4' : 'w-5 h-5'} /> TuProfe20 Lab
            </div>
        );

        function App() {
            const [view, setView] = useState('home');
            const [tab, setTab] = useState('teoria');
            const [muted, setMuted] = useState(false);
            const go = (t) => { AudioController.init(); AudioController.startBGM(); sfx('swoosh'); setTab(t); setView('lab'); window.scrollTo(0, 0); };
            const toggleMute = () => { AudioController.init(); setMuted(AudioController.toggleMute()); };
            const MuteBtn = (
                <button onClick={toggleMute} title={muted ? 'Activar sonido' : 'Silenciar'} className="w-12 h-12 shrink-0 rounded-2xl bg-white/10 border-2 border-white/30 text-white flex items-center justify-center backdrop-blur-md hover:bg-white/20 active:scale-95">
                    {muted ? <VolumeX className="w-6 h-6" /> : <Volume2 className="w-6 h-6" />}
                </button>
            );
            if (view === 'home') {
                return (
                    <div className="relative min-h-[100dvh] app-bg text-white">
                        <FloatingBackground />
                        <div className="relative z-10 max-w-[96rem] mx-auto px-4 sm:px-8 py-5 sm:py-7 flex flex-col min-h-[100dvh]">
                            <div className="flex justify-between items-center"><BrandBadge /> {MuteBtn}</div>
                            <div className="text-center mt-5 sm:mt-7">
                                <div className="inline-block px-4 py-1.5 rounded-full bg-white/10 border border-[#00f0ff]/60 text-[#5ff6ff] font-black text-xs sm:text-sm tracking-widest uppercase">Aritmética · Aula 2 (5.º y 6.º de primaria)</div>
                                <h1 className="mt-3 font-black leading-[1.05] text-4xl sm:text-6xl lg:text-7xl tracking-tight">
                                    <span className="text-[#ffe600] drop-shadow-[0_0_18px_rgba(255,230,0,0.6)]">TuProfe20 Lab</span>
                                    <span className="text-white/70"> · </span><br className="sm:hidden" />
                                    <span className="neon-text-big">División de números decimales</span>
                                </h1>
                                <p className="mt-3 max-w-3xl mx-auto text-white/85 font-bold text-base sm:text-xl">Mira cómo salta la coma, resuelve en galera paso a paso y ¡sal a la pizarra! 🚀</p>
                                <div className="mt-4 inline-flex items-center gap-3 px-5 py-2 rounded-3xl bg-white text-[#1b0a52] font-black text-3xl sm:text-5xl shadow-[0_0_30px_rgba(255,61,242,0.6)] border-4 border-[#ff3df2]">
                                    72<span className="text-[#ff1fd1]">,</span>96 <span className="text-[#7c3aed]">÷</span> 4 = <span className="text-[#047857]">18<span className="text-[#ff1fd1]">,</span>24</span>
                                </div>
                            </div>
                            <div className="mt-6 grid sm:grid-cols-2 lg:grid-cols-3 gap-4">
                                {TABS.map((t, i) => (
                                    <button key={t.key} onClick={() => go(t.key)} className={`group text-left p-5 rounded-[1.8rem] bg-gradient-to-br ${t.grad} border-[3px] border-white/60 shadow-[0_18px_40px_rgba(0,0,0,0.45)] hover:-translate-y-1.5 hover:shadow-[0_0_40px_rgba(255,255,255,0.35)] transition-all relative overflow-hidden ${t.dark ? 'text-[#0a0322]' : 'text-white'}`}>
                                        <div className="absolute -right-6 -top-6 w-28 h-28 rounded-full bg-white/20 blur-xl" />
                                        <div className="flex items-center justify-between"><span className="px-2.5 py-1 rounded-full bg-black/25 text-white font-black text-xs sm:text-sm">Actividad {i + 1}</span><span className="text-4xl">{t.icon}</span></div>
                                        <div className="mt-2 text-xl sm:text-2xl font-black leading-tight">{t.title.replace(/^\d · /, '')}</div>
                                        <div className="mt-1 text-sm sm:text-base font-bold opacity-95 leading-snug">{t.desc}</div>
                                        <div className="mt-3 inline-flex items-center gap-1 px-3 py-1.5 rounded-xl bg-white text-[#0a0322] font-black text-sm group-hover:gap-2 transition-all">¡Vamos! <ChevronRight className="w-4 h-4" /></div>
                                    </button>
                                ))}
                            </div>
                            <div className="mt-auto pt-6 text-center text-white/60 font-black text-sm flex items-center justify-center gap-1.5"><Rocket className="w-4 h-4" /> TuProfe20 Lab</div>
                        </div>
                    </div>
                );
            }
            return (
                <div className="relative min-h-[100dvh] app-bg text-white">
                    <FloatingBackground />
                    <div className="relative z-10 max-w-[120rem] mx-auto px-3 sm:px-5 py-3 flex flex-col gap-3">
                        <header className="flex items-center gap-2 sm:gap-3">
                            <button onClick={() => { sfx('swoosh'); setView('home'); }} title="Portada" className="w-12 h-12 shrink-0 rounded-2xl bg-white/10 border-2 border-white/30 flex items-center justify-center backdrop-blur-md hover:bg-white/20 active:scale-95"><Home className="w-6 h-6" /></button>
                            <h1 className="flex-1 min-w-0 font-black text-lg sm:text-3xl leading-tight">
                                <span className="text-[#ffe600]">TuProfe20 Lab</span> <span className="text-white/60">·</span> <span className="neon-text">División de números decimales</span>
                            </h1>
                            {MuteBtn}
                        </header>
                        <nav className="flex gap-2 overflow-x-auto scrollbar-hide pb-1">
                            {TABS.map(t => <Pill key={t.key} active={tab === t.key} grad={t.grad} dark={t.dark} onClick={() => go(t.key)}>{t.icon} {t.title}</Pill>)}
                        </nav>
                        <main>
                            {tab === 'teoria' && <TeoriaSection />}
                            {tab === 'libro' && <LibroSection />}
                            {tab === 'pizarra' && <PizarraSection />}
                            {tab === 'apps' && <AppsSection />}
                            {tab === 'coma' && <ComaSection />}
                            {tab === 'equipos' && <CompetenciaSection />}
                        </main>
                        <footer className="py-2 text-center text-white/50 font-black text-xs flex items-center justify-center gap-1.5"><Rocket className="w-3.5 h-3.5" /> TuProfe20 Lab</footer>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);

    </script>
</body>
</html>
